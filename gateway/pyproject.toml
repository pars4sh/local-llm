[project]
name = "local-llm-gateway"
version = "0.1.0"
description = "LiteLLM proxy environment for the local-llm gateway"
requires-python = "==3.12.*"
# Separate from the vLLM environment (D-011). See docs/decisions.md before changing the version.
dependencies = [
    "litellm[proxy]==1.105.1",
]

[dependency-groups]
# Tests for the auth hook and the gateway: uv run --project gateway pytest gateway/tests
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false
python-preference = "only-managed"

[tool.pytest.ini_options]
filterwarnings = ["ignore::UserWarning:pydantic._internal._generate_schema"]
