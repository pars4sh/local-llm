# Model roster: the single source of truth for what the serving job runs.
#
# cluster/roster.py validates this file and builds each model's `vllm serve` command; the
# launcher, the download script and (later) the gateway config all read it from there.
# Weights live in $LLM_MODEL_DIR/<hf_repo>.
#
# Fields per [[model]]:
#   name                    gateway alias, also vLLM's --served-model-name
#   kind                    chat | embed | rerank
#   hf_repo                 Hugging Face repository ID
#   gpu_memory_utilization  vLLM's share of the GPU; enabled models must sum to <= 0.9
#   max_model_len           context length in tokens
#   order                   start order, lowest first (vLLM sizes its share at startup)
#   enabled                 start this model in the serving job
#   extra_args              further `vllm serve` flags. The launcher owns --host, --port,
#                           --served-model-name, --gpu-memory-utilization and --max-model-len.
#                           Paths are relative to the repository root.
#
# Keep the budget table in docs/architecture.md in sync with the shares here.
#
# [client] names the model the laptop client (Open WebUI) uses for each role. Each must be an
# enabled model of the right kind; client/compose.sh reads them with `roster.py client-env`.

[client]
default_model = "qwen-main"     # chat: preselected in new chats
task_model = "qwen-fast"        # chat: titles, tags, search queries
embedding_model = "embed"       # embed: RAG vectors
reranking_model = "rerank"      # rerank: RAG rerank

[[model]]
name = "qwen-main"
kind = "chat"
hf_repo = "Qwen/Qwen3.8-27B-FP8"
gpu_memory_utilization = 0.60
max_model_len = 262144
order = 1
enabled = true
# --kv-cache-dtype auto (BF16) and MTP with 2 draft tokens: see D-006.
# --max-num-seqs: each running sequence needs one linear-attention state block. vLLM 0.32
# defaults to 1024 sequences, but a 0.60 share holds about 460 blocks, and startup fails.
extra_args = [
    "--kv-cache-dtype", "auto",
    "--speculative-config", '{"method": "mtp", "num_speculative_tokens": 2}',
    "--max-num-seqs", "64",
    "--reasoning-parser", "qwen3",
    "--enable-auto-tool-choice",
    "--tool-call-parser", "qwen3_coder",
]

# Task model (titles, tags, search queries) and quick Q&A. Thinking is off by default, since
# task requests don't set chat_template_kwargs; a request can still turn it on. No image
# input: the Figures preset uses qwen-main, and skipping the vision encoder saves memory.
# Hybrid attention like qwen-main, so --max-num-seqs must fit its small share.
[[model]]
name = "qwen-fast"
kind = "chat"
hf_repo = "Qwen/Qwen3.5-4B"
gpu_memory_utilization = 0.12
max_model_len = 32768
order = 2
enabled = true
extra_args = [
    "--max-num-seqs", "16",
    "--limit-mm-per-prompt", '{"image": 0, "video": 0}',
    "--default-chat-template-kwargs", '{"enable_thinking": false}',
    "--reasoning-parser", "qwen3",
]

# RAG chunks are short, so a small context keeps the share small.
[[model]]
name = "embed"
kind = "embed"
hf_repo = "Qwen/Qwen3-Embedding-0.6B"
gpu_memory_utilization = 0.04
max_model_len = 8192
order = 3
enabled = true
extra_args = [
    "--runner", "pooling",
    "--convert", "embed",
]

# The original Qwen3 reranker checkpoint is a causal LM; vLLM serves it as a classifier
# through these overrides, at /rerank. The template is the model card's prompt format;
# without it vLLM warns that scores may be inaccurate.
[[model]]
name = "rerank"
kind = "rerank"
hf_repo = "Qwen/Qwen3-Reranker-0.6B"
gpu_memory_utilization = 0.04
max_model_len = 8192
order = 4
enabled = true
extra_args = [
    "--runner", "pooling",
    "--hf-overrides",
    '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}',
    "--chat-template", "config/templates/qwen3_reranker.jinja",
]
